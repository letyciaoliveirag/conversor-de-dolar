<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversor</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="divPai">
      <h1>Conversor de Dólar</h1>
      <div class="quadroDivPai">
        <span>R$:</span>
        <input type="number" placeholder="Valor em Reais" />
      </div>

      <div class="botoes">
        <!-- botão que converte R$ em US$ -->
        <button class="button1" onclick="converter()">Converter</button>

        <!-- botão que limpa -->
        <button class="button2" onclick="limpar()">Limpar</button>
      </div>
    </div>

    <!-- espaço vazio onde o resultado vai aparecer -->
    <p id="resultado"></p>

    <script src="script.js"></script>
  </body>
</html>
